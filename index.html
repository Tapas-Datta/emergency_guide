<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Emergency Command Medical Portal Center</title>
    <style>
        :root {
            --bg: #f4f6f9;
            --text: #2c3e50;
            --card-bg: #ffffff;
            --border: #e2e8f0;
            --accent: #d32f2f;
            --accent-hover: #b71c1c;
            --box-bg: #f8fafc;
            --shadow: 0 4px 6px -1px rgba(0,0,0,0.05), 0 2px 4px -1px rgba(0,0,0,0.03);
            --radius: 12px;
        }
        [data-theme="dark"] {
            --bg: #0f172a;
            --text: #f1f5f9;
            --card-bg: #1e293b;
            --border: #334155;
            --accent: #ef5350;
            --accent-hover: #f87171;
            --box-bg: #0f172a;
            --shadow: 0 4px 6px -1px rgba(0,0,0,0.3);
        }

        body { font-family: 'Segoe UI', system-ui, Arial, sans-serif; background-color: var(--bg); color: var(--text); margin: 0; padding: 20px; transition: background 0.3s, color 0.3s; line-height: 1.5; }
        .wrapper { max-width: 680px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }

        /* PREMIUM PANEL WRAPPERS */
        .panel { background: var(--card-bg); border: 1px solid var(--border); border-radius: var(--radius); padding: 24px; box-shadow: var(--shadow); transition: transform 0.2s, background 0.3s; }

        .alert-hub { background: linear-gradient(135deg, #d32f2f, #9a0007); color: #fff; padding: 16px; border-radius: var(--radius); text-align: center; font-size: 20px; font-weight: 800; text-transform: uppercase; box-shadow: 0 10px 15px -3px rgba(211,47,47,0.3); display: flex; align-items: center; justify-content: center; gap: 10px; }
                /* HEADER TELEMETRY CLOCK */
        .header-actions { display: flex; justify-content: space-between; align-items: center; gap: 15px; }
        .header-title h2 { margin: 0; font-size: 26px; font-weight: 800; letter-spacing: -0.5px; }

        .dashboard-meta { display: flex; align-items: center; gap: 8px; font-weight: 700; font-family: 'Courier New', Courier, monospace; font-size: 15px; background: var(--box-bg); color: var(--text); padding: 10px 16px; border-radius: var(--radius); border: 1px solid var(--border); margin-top: 8px; width: fit-content; box-shadow: inset 0 2px 4px 0 rgba(0,0,0,0.02); }
        .pulse-heart { color: #d32f2f; animation: heartBeating 1.2s infinite alternate; display: inline-block; }
        @keyframes heartBeating { 0% { transform: scale(1); } 100% { transform: scale(1.2); filter: drop-shadow(0 0 4px #d32f2f); } }

        .theme-btn { background: var(--text); color: var(--card-bg); border: none; padding: 10px 18px; border-radius: 8px; font-weight: 700; cursor: pointer; font-size: 14px; transition: opacity 0.2s; }
        .theme-btn:hover { opacity: 0.9; }

        /* MODERN INTERACTIVE INPUT FIELDS */
        .search-container { position: relative; display: flex; align-items: center; width: 100%; }
        .search-field { width: 100%; padding: 18px 50px 18px 18px; font-size: 18px; border: 2px solid var(--border); border-radius: var(--radius); box-sizing: border-box; outline: none; background: var(--card-bg); color: var(--text); box-shadow: var(--shadow); transition: border-color 0.2s, box-shadow 0.2s; }
        .search-field:focus { border-color: var(--accent); box-shadow: 0 0 0 4px rgba(211,47,47,0.15); }

        .suggestions-box { position: absolute; top: calc(100% + 6px); left: 0; right: 0; background: var(--card-bg); border: 1px solid var(--border); border-radius: var(--radius); max-height: 220px; overflow-y: auto; z-index: 1000; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1); display: none; }
        .suggestion-item { padding: 14px 18px; cursor: pointer; color: var(--text); font-size: 16px; font-weight: 500; border-bottom: 1px solid var(--border); transition: background 0.2s; }
        .suggestion-item:hover { background: var(--box-bg); color: var(--accent); }

        .filter-hub { display: flex; gap: 10px; flex-wrap: wrap; }
        .filter-btn { background: var(--card-bg); color: var(--text); border: 1px solid var(--border); padding: 8px 18px; border-radius: 20px; font-weight: 700; cursor: pointer; transition: 0.2s; font-size: 14px; box-shadow: var(--shadow); }
        .filter-btn.active, .filter-btn:hover { background: var(--accent); color: #fff; border-color: var(--accent); }

        /* SOS ACTION TOOLBAR HUB BUTTONS */
        .sos-title { margin: 0 0 16px 0; color: var(--text); display: flex; align-items: center; gap: 8px; font-size: 16px; font-weight: 700; justify-content: center; opacity: 0.9; }
        .toolbar-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; justify-content: center; }
        .toolbar-btn { display: flex; align-items: center; justify-content: center; gap: 8px; color: white; border: none; padding: 14px 16px; border-radius: 8px; font-weight: 700; cursor: pointer; font-size: 15px; transition: transform 0.1s, filter 0.2s; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.08); }
        .toolbar-btn:active { transform: scale(0.98); }
        .toolbar-btn:hover { filter: brightness(1.08); }

        /* CARDS RENDER GRID ARCHITECTURE */
        .card { background: var(--card-bg); border: 1px solid var(--border); border-left: 5px solid var(--accent); border-radius: var(--radius); padding: 24px; box-shadow: var(--shadow); text-align: left; position: relative; display: flex; flex-direction: column; gap: 12px; }
        .card-title { font-size: 22px; color: var(--text); font-weight: 800; margin: 0; max-width: 75%; letter-spacing: -0.3px; }
        .tag { background: var(--box-bg); color: var(--text); padding: 6px 12px; font-size: 13px; font-weight: 700; border-radius: 6px; display: inline-block; border: 1px solid var(--border); width: fit-content; }
        .heading { font-size: 15px; font-weight: 700; color: var(--text); text-transform: uppercase; letter-spacing: 0.5px; opacity: 0.8; margin-top: 5px; }
        .symptoms-desc { font-size: 16px; color: var(--text); background: var(--box-bg); padding: 14px; border-radius: 8px; border: 1px solid var(--border); }
        .action-box { font-size: 18px; line-height: 1.6; color: var(--text); background: #f1f8e9; padding: 16px; border-radius: 8px; border-left: 4px solid #4caf50; font-weight: 700; box-shadow: inset 0 2px 4px 0 rgba(0,0,0,0.01); }
        [data-theme="dark"] .action-box { background: #1e293b; border-left-color: #4caf50; }
        .empty-state { text-align: center; padding: 40px; color: var(--text); font-size: 16px; font-weight: 500; opacity: 0.7; }

        .copy-card-btn { position: absolute; top: 22px; right: 22px; background: var(--box-bg); color: var(--text); border: 1px solid var(--border); padding: 8px 14px; border-radius: 6px; font-weight: 700; cursor: pointer; font-size: 13px; transition: 0.2s; }
        .copy-card-btn:hover { background: var(--accent); color: white; border-color: var(--accent); }
    </style>
</head>
<body>

<div class="wrapper" id="pdfPrintField">
    <div class="alert-hub">🔴 EMERGENCY COMMAND MEDICAL PORTAL CENTER</div>

    <div class="panel header-actions">
        <div class="header-title">
            <h2>Instant Medical Guide</h2>
            <div class="dashboard-meta">
                <span class="pulse-heart">❤️</span> RADAR OVERVIEW ACTIVE | <span id="dashboardClock">00:00:00 PM</span>
            </div>
        </div>
        <button id="themeToggle" class="theme-btn">🌙 Dark Mode</button>
    </div>

    <div class="search-container">

        <button id="voiceBtn" style="position: absolute; right: 20px; font-size: 24px; cursor: pointer; background: none; border: none;" title="Voice Search">🎙️</button>
        <div id="suggestionsBox" class="suggestions-box"></div>
    </div>

    <div class="filter-hub">
        <button class="filter-btn active" data-cat="all">All</button>
        <button class="filter-btn" data-cat="Heart">Heart</button>
        <button class="filter-btn" data-cat="Shock">Shock</button>
    </div>

    <!-- MAIN SOS ACTION TOOLBAR PANEL -->
    <div class="panel" style="border-top: 4px solid var(--accent);">
        <div class="sos-title">⚡ QUICK ACTION & SOS TOOLKIT</div>
        <div class="toolbar-grid">
            <button id="findHospitalBtn" class="toolbar-btn" style="background: #e65100;">📍 Find Hospital Near Me</button>
            <button id="pdfBtn" class="toolbar-btn" style="background: #0d47a1;">📥 Export Guide to PDF</button>
            <button id="alarmBtn" class="toolbar-btn" style="background: #cc0000;">🔊 SOS Audio Alarm</button>
            <button id="shareLocationBtn" class="toolbar-btn" style="background: #25D366;">🟢 Share Location via WhatsApp</button>
            <button id="sosCardBtn" class="toolbar-btn" style="background: #1e293b;">📋 Generate SOS Card</button>
        </div>

        <!-- MEMO NOTES CONTAINER -->
        <div style="margin-top: 20px; border-top: 1px solid var(--border); padding-top: 15px;">
            <strong style="font-size:15px; display: block; margin-bottom: 8px;">📝 Active Incident Notes Pad (Local Save)</strong>
            <textarea id="emergencyNotes" style="width: 100%; height: 85px; padding: 12px; border-radius: 8px; border: 1px solid var(--border); background: var(--box-bg); color: var(--text); box-sizing: border-box; font-size: 15px; resize: none; font-family: inherit; outline: none;" placeholder="Type emergency case details here (e.g. blood group, active drugs, allergens)..."></textarea>
            <button id="clearNotesBtn" style="margin-top:8px; background:transparent; color:var(--accent); border:1px solid var(--accent); padding:6px 12px; font-size:13px; border-radius:6px; cursor:pointer; font-weight:700; transition: 0.2s;">🗑️ Clear Data Log</button>
        </div>

        <div id="sosCardDisplay" style="none; background: var(--box-bg); border: 1px solid var(--border); padding: 14px; border-radius: 8px; margin-top: 15px; font-size: 15px; font-family: monospace;">
            <strong style="color: var(--accent);">📌 TEMPORARY RESPO LOG METADATA:</strong><br>
            <span id="sosTimestamp"></span><br>
            <span style="font-size: 13px; opacity: 0.8;">Keep screen active for on-scene response handover.</span>
        </div>
    </div>

    <div id="resultsHub"></div>
</div>

         const searchBar = document.getElementById('searchBar');
    const resultsHub = document.getElementById('resultsHub');
    const themeToggle = document.getElementById('themeToggle');
    const voiceBtn = document.getElementById('voiceBtn');
    const filterBtns = document.querySelectorAll('.filter-btn');
    const suggestionsBox = document.getElementById('suggestionsBox');
    const alarmBtn = document.getElementById('alarmBtn');
    const pdfBtn = document.getElementById('pdfBtn');
    const shareLocationBtn = document.getElementById('shareLocationBtn');
    const findHospitalBtn = document.getElementById('findHospitalBtn');

    let activeCategory = 'all';
    let audioCtx = null;
    let alarmInterval = null;

    // PUSH NOTIFICATIONS AUTHORIZATION
    if (Notification.permission !== "granted" && Notification.permission !== "denied") {
        Notification.requestPermission();
    }

    // 1. DYNAMIC COLOR MODE (Dark/Light Switch)
    themeToggle.addEventListener('click', () => {
        const isDark = document.body.getAttribute('data-theme') === 'dark';
        if (isDark) {
            document.body.removeAttribute('data-theme');
            themeToggle.innerHTML = "🌙 Dark Mode";
        } else {
            document.body.setAttribute('data-theme', 'dark');
            themeToggle.innerHTML = "☀️ Light Mode";
        }
    });

    // TICKER CLOCK ENGINE
    function updateDashboardClock() {
        const now = new Date();
        const clockEl = document.getElementById('dashboardClock');
        if (clockEl) clockEl.innerText = now.toLocaleTimeString();
    }
    setInterval(updateDashboardClock, 1000);
    updateDashboardClock();

    // LOCALSTORAGE EMERGENCY NOTES PAD LOGIC
    const emergencyNotes = document.getElementById('emergencyNotes');
    const clearNotesBtn = document.getElementById('clearNotesBtn');

    if (emergencyNotes) {
        if(localStorage.getItem('sos_active_notes')) {
            emergencyNotes.value = localStorage.getItem('sos_active_notes');
        }
        emergencyNotes.addEventListener('input', () => {
            localStorage.setItem('sos_active_notes', emergencyNotes.value);
        });
    }
    if (clearNotesBtn && emergencyNotes) {
        clearNotesBtn.addEventListener('click', () => {
            emergencyNotes.value = '';
            localStorage.removeItem('sos_active_notes');
        });
    }

    // 2. CORE SEARCH ENGINE
    function processSearch() {
        const value = searchBar.value.trim().toLowerCase();
        resultsHub.innerHTML = '';

        if (value.length < 2 && activeCategory === 'all') { return; }

        const matches = localDiseases.filter(item => {
            const matchesSearch = value.length < 2 ||
                item.name.toLowerCase().includes(value) ||
                item.symptoms.toLowerCase().includes(value) ||
                item.category.toLowerCase().includes(value);

            const matchesCategory = activeCategory === 'all' ||
                item.category.toLowerCase().includes(activeCategory.toLowerCase());

            return matchesSearch && matchesCategory;
        });

        if (matches.length === 0) {
            resultsHub.innerHTML = '<div class="empty-state">No matching emergency details found. Please check your spelling or search terms.</div>';
            return;
        }

        matches.forEach(item => {
            const element = document.createElement('div');
            element.className = 'card';
            element.innerHTML = `
                <button class="copy-card-btn" onclick="copyBlueprint('${item.name}')">📋 Copy Blueprint</button>
                <div class="card-title">${item.name}</div>
                <div class="tag">📂 ${item.category}</div>
                <div class="heading">⚠️ Key Symptoms:</div>
                <div class="symptoms-desc">${item.symptoms}</div>
                <div class="heading">✅ Instant Life-Saving Solution:</div>
                <div class="action-box">${item.solution}</div>
            `;
            resultsHub.appendChild(element);

            // NATIVE DESKTOP NOTIFICATION BROADCAST
            if (Notification.permission === "granted" && (item.name.toLowerCase().includes('attack') || item.name.toLowerCase().includes('arrest') || item.name.toLowerCase().includes('shock'))) {
                new Notification("🚨 CRITICAL RESPONSE PROTOCOL", {
                    body: `Active emergency view open for: ${item.name}. Review treatment solutions immediately!`,
                });
            }
        });
    }

    // ONE-CLICK BLUEPRINT COPY ENGINE
    window.copyBlueprint = function(name) {
        const target = localDiseases.find(d => d.name === name);
        if(target) {
            const compiledText = `EMERGENCY FIRST AID BLUEPRINT\nCondition: ${target.name}\nCategory: ${target.category}\n\nSymptoms:\n${target.symptoms}\n\nImmediate Actions:\n${target.solution}`;
            navigator.clipboard.writeText(compiledText).then(() => {
                alert(`📋 Blueprint for "${target.name}" successfully copied to clipboard!`);
            });
        }
    };

    // 3. AUTO-SUGGESTION DROPDOWN ENGINE
    searchBar.addEventListener('input', () => {
        const value = searchBar.value.trim().toLowerCase();
        suggestionsBox.innerHTML = '';

        if (value.length < 2) {
            suggestionsBox.style.display = 'none';
            processSearch();
            return;
        }

        const hints = localDiseases.filter(item => item.name.toLowerCase().includes(value)).slice(0, 5);

        if (hints.length > 0) {
            hints.forEach(item => {
                const div = document.createElement('div');
                div.className = 'suggestion-item';
                div.innerText = item.name;
                div.addEventListener('click', () => {
                    searchBar.value = item.name;
                    suggestionsBox.style.display = 'none';
                    processSearch();
                });
                suggestionsBox.appendChild(div);
            });
            suggestionsBox.style.display = 'block';
        } else {
            suggestionsBox.style.display = 'none';
        }
        processSearch();
    });

    document.addEventListener('click', (e) => {
        if (e.target !== searchBar && e.target !== suggestionsBox) {
            suggestionsBox.style.display = 'none';
        }
    });

    // 4. CATEGORY FILTERS
    filterBtns.forEach(btn => {
        btn.addEventListener('click', (e) => {
            filterBtns.forEach(b => b.classList.remove('active'));
            e.target.classList.add('active');
            activeCategory = e.target.getAttribute('data-cat');
            processSearch();
        });
    });

    // 5. VOICE SEARCH
    if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        const recognition = new SpeechRecognition();
        recognition.continuous = false;
        recognition.lang = 'en-US';

        voiceBtn.addEventListener('click', () => {
            voiceBtn.innerHTML = "🛑 Listening...";
            voiceBtn.style.color = "#d32f2f";
            recognition.start();
        });

        recognition.onresult = (event) => {
            searchBar.value = event.results.transcript;
            voiceBtn.innerHTML = "🎙️";
            voiceBtn.style.color = "";
            processSearch();
        };

        recognition.onerror = () => { voiceBtn.innerHTML = "🎙️"; voiceBtn.style.color = ""; };
        recognition.onend = () => { voiceBtn.innerHTML = "🎙️"; voiceBtn.style.color = ""; };
    } else {
        voiceBtn.style.display = 'none';
    }

    // 6. PDF EXPORT COMPONENT INTERFACE (NATIVE PRINT ENGINE)
    if (pdfBtn) { pdfBtn.addEventListener('click', () => { window.print(); }); }

    // 7. SOS AUDIO ALARM SIREN
    if (alarmBtn) {
        alarmBtn.addEventListener('click', () => {
            if (alarmInterval) {
                clearInterval(alarmInterval);
                alarmInterval = null;
                alarmBtn.innerHTML = "🔊 SOS Audio Alarm";
                alarmBtn.style.background = "#cc0000";
                return;
            }
            if (!audioCtx) { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
            alarmBtn.innerHTML = "🛑 STOP ALARM";
            alarmBtn.style.background = "#222";
            alarmInterval = setInterval(() => {
                let osc = audioCtx.createOscillator();
                let gain = audioCtx.createGain();
                osc.frequency.setValueAtTime(800, audioCtx.currentTime);
                osc.frequency.linearRampToValueAtTime(1200, audioCtx.currentTime + 0.3);
                gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
                osc.connect(gain); gain.connect(audioCtx.destination);
                osc.start(); osc.stop(audioCtx.currentTime + 0.3);
            }, 400);
        });
    }

    // 8. SOS CARD GENERATOR
    if (sosCardBtn) {
        sosCardBtn.addEventListener('click', () => {
            if (sosCardDisplay.style.display === 'none') {
                const now = new Date();
                sosTimestamp.innerHTML = `⚠️ Incident Registered At: ${now.toLocaleTimeString()} | Status: Active Local Log`;
                sosCardDisplay.style.display = 'block';
                sosCardBtn.innerHTML = "❌ Hide SOS Card";
            } else {
                sosCardDisplay.style.display = 'none';
                sosCardBtn.innerHTML = "📋 Generate SOS Card";
            }
        });
    }

    // 9. WHATSAPP EMERGENCY LIVE LOCATION ENGINE (FIXED ENCODING STRINGS)
if (shareLocationBtn) {
    shareLocationBtn.addEventListener('click', () => {
        shareLocationBtn.innerHTML = "🔄 Locating GPS...";
        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(
                (position) => {
                    const mapsLink = `https://google.com{position.coords.latitude},${position.coords.longitude}`;
                    const messageText = `Emergency! My pinpoint live location is: ${mapsLink}`;
                    shareLocationBtn.innerHTML = "🟢 Share Location via WhatsApp";
                    window.open(`https://whatsapp.com{encodeURIComponent(messageText)}`, '_blank');
                },
                () => {
                    const fallbackText = "Emergency! My browser location is secure-locked. Please check on me urgently near Messina!";
                    shareLocationBtn.innerHTML = "🟢 Share Location via WhatsApp";
                    window.open(`https://whatsapp.com{encodeURIComponent(fallbackText)}`, '_blank');
                },
                { enableHighAccuracy: true, timeout: 8000, maximumAge: 0 }
            );
        }
    });
}

// 10. HIGH-ACCURACY MAP ROUTER FOR HOSPITALS (FIXED LIVE NAVIGATION SEARCH)
if (findHospitalBtn) {
    findHospitalBtn.addEventListener('click', () => {
        findHospitalBtn.innerHTML = "🔄 Locating Rooms...";
        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(
                (position) => {
                    const searchUrl = `https://google.com{position.coords.latitude},${position.coords.longitude},14z`;
                    findHospitalBtn.innerHTML = "📍 Find Hospital Near Me";
                    window.open(searchUrl, '_blank');
                },
                () => {
                    window.open("https://google.com", '_blank');
                    findHospitalBtn.innerHTML = "📍 Find Hospital Near Me";
                },
                { enableHighAccuracy: true, timeout: 5000, maximumAge: 0 }
            );
        }
    });
}
</script>
